# Source Configuration for Grading Pipeline Evidence Index
# Extends retrieval_core with PDF support and incremental indexing

# NEW: Index definitions section
indexes:
  word_index:
    type: "character"
    chunk_size: 512
    chunk_overlap: 50
    source_type_overrides:
      slide: 128  # Slides use smaller chunks
    collection_name: "word_index"
    enabled: true

  sentence_index:
    type: "sentence"
    chunk_size: 256  # in tokens
    chunk_overlap: 50
    secondary_chunking_regex_default: "[^,.;。？！]+[,.;。？！]?|[,.;。？！]"
    secondary_chunking_regex_slides: "[^,.;\\n。？！]+[,.;\\n。？！]?|[,.;\\n。？！]"
    collection_name: "sentence_index"
    enabled: true

  paragraph_index:
    type: "paragraph"
    chunk_size: 1024  # in tokens
    chunk_overlap: 100
    paragraph_separator: "\n\n"
    collection_name: "paragraph_index"
    enabled: true  # Disabled by default, enable to use

# NEW: Runtime index selection
runtime:
  active_indexes: ["word_index", "sentence_index"]  # Default subset

sources:
  # PDF source - slides on data type quality
  - type: "file"
    path: "grading_pipeline/sources"
    patterns: ["*.pdf"]
    metadata:
      source_type: "slide"
      description: "Data type and quality lecture slides"

# Retrieval configuration (same as retrieval_core)
retrieval:
  top_k_per_index: 10  # Number of results to retrieve from each index
  final_top_k: 5       # Number of results after reranking
  similarity_threshold: 0.0  # Minimum similarity score

# Reranker configuration (same as retrieval_core)
reranker:
  model: "cross-encoder/ms-marco-MiniLM-L-6-v2"  # Default cross-encoder model
  batch_size: 32  # Batch size for reranking

# Debug configuration
debug:
  embedding_diagnostics: false  # Print embedding diagnostics in tests

# Chunking configuration for index building
chunking:
  word:
    chunk_size: 512  # Characters per chunk (overridden to 128 for slides by source_type)
    chunk_overlap: 50  # Character overlap between chunks
  sentence:
    chunk_size: 256  # TOKENS per chunk (SentenceSplitter uses token-based measurement)
    chunk_overlap: 50  # TOKEN overlap between chunks
    # Secondary chunking regex for when no sentence delimiters are found
    # Default: [^,.;。？！]+[^,.;。？！]?  (splits on punctuation)
    # For slides: add \n to split on line breaks
    secondary_chunking_regex_default: "[^,.;。？！]+[,.;。？！]?|[,.;。？！]"
    secondary_chunking_regex_slides: "[^,.;\\n。？！]+[,.;\\n。？！]?|[,.;\\n。？！]"
