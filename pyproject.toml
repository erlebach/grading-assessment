[project]
name = "autograder"
version = "0.1.0"
description = "Intelligent autograding system with RAG-based evidence retrieval"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "llama-index-core>=0.10.0",
    "llama-index-embeddings-openai>=0.1.0",
    "llama-index-embeddings-huggingface>=0.1.0",
    "llama-index-llms-openai>=0.1.0",
    "llama-index-llms-anthropic>=0.1.0",
    "llama-index-llms-ollama>=0.1.0",
    "llama-index-llms-gemini>=0.1.0",
    "llama-index-vector-stores-chroma>=0.1.0",
    "chromadb>=0.4.0",
    "sentence-transformers>=2.2.0",
    "lmql>=0.7.0",
    "pypdf>=3.0.0",
    "pydantic>=2.12.5",
    "tabulate>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
]
vector_stores = [
    "llama-index-vector-stores-qdrant>=0.1.0",
    "chromadb>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["grader", "config", "mwe", "version1", "version2", "v2"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.1.0",
    "pymupdf>=1.24",
    "hypothesis>=6.100",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "plugins/grading/python/tests"]
